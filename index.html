<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RK ELECTRONICS - LED TV Repair Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Prevent image downloading and long press save */
    img {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none;
    }
    #zoomContainer {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans pb-20 select-none" oncontextmenu="return false;">

  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-blue-600 p-4 rounded-xl shadow-lg flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-wide">RK ELECTRONICS</h1>
        <p class="text-xs text-blue-200">LED TV Repair Hub & AI Diagnostics</p>
      </div>
      <button onclick="toggleAdminPanel()" class="text-xs font-bold bg-blue-800 hover:bg-blue-700 text-white px-3 py-2 rounded-lg border border-blue-400 active:scale-95 transition flex items-center gap-1">
        <span>⚙</span> Admin
      </button>
    </div>

    <!-- Search Form -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow-md">
      <div>
        <label class="block text-sm font-medium mb-1.5 text-slate-300">TV Model / Board Number / Fault:</label>
        <input type="text" id="modelInput" placeholder="e.g. CA1235 or UA32FH4003" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
      </div>
      <button onclick="searchInDatabase()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm transition tracking-wider active:scale-[0.98]">
        Analyze & Search Solutions
      </button>
    </div>

    <!-- Verified Database Posts -->
    <div id="verifiedPostsCard" class="hidden space-y-3">
      <h2 class="text-xs font-bold text-green-400 uppercase tracking-widest pl-1">
        ✓ Verified Master Solutions
      </h2>
      <div id="verifiedPostsList" class="space-y-3"></div>
    </div>

    <!-- AI Diagnostic Output -->
    <div id="outputCard" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2.5 shadow-md">
      <h2 class="text-sm font-bold text-blue-400">
        AI Instant Diagnostic Guide:
      </h2>
      <div id="resultContent" class="text-xs text-slate-200 whitespace-pre-line leading-relaxed pl-1"></div>
    </div>

    <!-- ================= ADMIN PANEL SECTION ================= -->
    <div id="adminPanel" class="hidden bg-slate-800 p-4 rounded-xl border-2 border-yellow-500/50 space-y-3 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <h2 class="text-sm font-bold text-yellow-400 flex items-center gap-1.5">
          <span>➕</span> Add TV Fault Solution
        </h2>
        <button onclick="toggleAdminPanel()" class="text-xs text-slate-400 hover:text-white px-2 py-1">✕ Close</button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-300 mb-1">Model Number:</label>
          <input type="text" id="admModel" placeholder="e.g. CA1235 or UA32T4340AK" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500">
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Board / Chassis Number:</label>
          <input type="text" id="admBoard" placeholder="e.g. CA 1235 / TP.SK506S.PB801" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500">
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Fault / Solution Details:</label>
          <textarea id="admSolution" rows="3" placeholder="e.g. Buck converter voltage details and on/off trick..." class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500"></textarea>
        </div>

        <!-- 4 Separate Photo Slots -->
        <div class="space-y-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700">
          <label class="block text-yellow-400 font-bold">Select Circuit / Fault Photos:</label>
          <div>
            <span class="text-[10px] text-slate-400">Photo 1 (Main):</span>
            <input type="file" id="admImage1" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-slate-300 text-[11px] file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-yellow-500 file:text-slate-900">
          </div>
          <div>
            <span class="text-[10px] text-slate-400">Photo 2 (Optional):</span>
            <input type="file" id="admImage2" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-slate-300 text-[11px] file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-slate-700 file:text-slate-200">
          </div>
          <div>
            <span class="text-[10px] text-slate-400">Photo 3 (Optional):</span>
            <input type="file" id="admImage3" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-slate-300 text-[11px] file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-slate-700 file:text-slate-200">
          </div>
          <div>
            <span class="text-[10px] text-slate-400">Photo 4 (Optional):</span>
            <input type="file" id="admImage4" accept="image/*" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-slate-300 text-[11px] file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-slate-700 file:text-slate-200">
          </div>
        </div>

        <button onclick="uploadNewSolution()" id="admUploadBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2.5 rounded-lg text-xs transition active:scale-95 shadow">
          Upload Directly to Database
        </button>
        <p id="admStatusMsg" class="text-center text-[11px] hidden font-semibold"></p>
      </div>
    </div>
    <!-- ======================================================== -->

  </div>

  <!-- 4-Way Drag & Smooth Zoom Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-3 select-none" oncontextmenu="return false;">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between bg-slate-900/90 p-2.5 rounded-xl border border-slate-700 z-10">
      <span class="text-xs text-yellow-400 font-bold">🔍 Circuit Inspector (Drag anywhere)</span>
      <button onclick="closeZoomModal()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-3.5 py-1.5 rounded-lg text-xs active:scale-95">✕ Close</button>
    </div>

    <!-- Drag & Move Viewport -->
    <div id="zoomContainer" class="relative overflow-hidden flex-1 my-2 flex items-center justify-center bg-black/40 rounded-xl border border-slate-800 cursor-grab active:cursor-grabbing">
      <img id="modalImg" src="" draggable="false" oncontextmenu="return false;" style="transform: translate(0px, 0px) scale(1); transform-origin: center center; cursor: grab;" class="max-w-full max-h-full object-contain pointer-events-auto select-none" alt="Circuit View">
    </div>

    <!-- Bottom Controls -->
    <div class="flex items-center justify-center gap-3 bg-slate-900/90 p-2 rounded-xl border border-slate-700 z-10">
      <button onclick="changeZoom(-0.4)" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 py-2 rounded-lg text-sm border border-slate-600 active:scale-90">➖ Zoom Out</button>
      <button onclick="resetZoom()" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold px-3 py-2 rounded-lg text-xs border border-slate-600 active:scale-90">↺ Reset</button>
      <button onclick="changeZoom(0.4)" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm active:scale-90">➕ Zoom In</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zilgbuncmusoxgerluxs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zFfU8GvAKqHf2KXNwyqwzQ_4XjHLHKW";
    const ADMIN_PIN = "halkut0609";

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdminLoggedIn = false;

    // Zoom & 4-Way Drag Variables
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const modalImg = document.getElementById('modalImg');
    const zoomContainer = document.getElementById('zoomContainer');

    function applyTransform() {
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function changeZoom(delta) {
      scale = Math.max(0.8, Math.min(5.0, scale + delta));
      applyTransform();
    }

    function resetZoom() {
      scale = 1.0;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function openZoomModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      modalImg.src = imgSrc;
      resetZoom();
      modal.classList.remove('hidden');
    }

    function closeZoomModal() {
      document.getElementById('imageModal').classList.add('hidden');
    }

    // Touch & Mouse Drag Handlers (Left, Right, Up, Down)
    function onPointerDown(e) {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX - translateX;
      startY = clientY - translateY;
      zoomContainer.style.cursor = 'grabbing';
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      translateX = clientX - startX;
      translateY = clientY - startY;
      applyTransform();
    }

    function onPointerUp() {
      isDragging = false;
      zoomContainer.style.cursor = 'grab';
    }

    zoomContainer.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    zoomContainer.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    function toggleAdminPanel() {
      const panel = document.getElementById('adminPanel');
      if (panel.classList.contains('hidden')) {
        if (!isAdminLoggedIn) {
          const pin = prompt("Admin Security Password enter karein:");
          if (pin === ADMIN_PIN) {
            isAdminLoggedIn = true;
            panel.classList.remove('hidden');
          } else if (pin !== null) {
            alert("Galat Password!");
          }
        } else {
          panel.classList.remove('hidden');
        }
      } else {
        panel.classList.add('hidden');
      }
    }

    async function uploadNewSolution() {
      const model = document.getElementById('admModel').value.trim();
      const board = document.getElementById('admBoard').value.trim();
      const solution = document.getElementById('admSolution').value.trim();
      const uploadBtn = document.getElementById('admUploadBtn');
      const statusMsg = document.getElementById('admStatusMsg');

      if (!model || !solution) {
        alert("Model Number aur Solution likhna zaroori hai.");
        return;
      }

      const fileInputs = [
        document.getElementById('admImage1'),
        document.getElementById('admImage2'),
        document.getElementById('admImage3'),
        document.getElementById('admImage4')
      ];

      const selectedFiles = [];
      fileInputs.forEach(inp => {
        if (inp && inp.files && inp.files[0]) {
          selectedFiles.push(inp.files[0]);
        }
      });

      uploadBtn.disabled = true;
      uploadBtn.innerText = "Uploading... Please wait...";
      statusMsg.className = "text-center text-[11px] text-yellow-400 font-semibold block";
      statusMsg.innerText = "Connecting to Database...";

      try {
        let uploadedImageNames = [];

        if (selectedFiles.length > 0) {
          for (let i = 0; i < selectedFiles.length; i++) {
            statusMsg.innerText = `Uploading photo ${i + 1} of ${selectedFiles.length}...`;
            const file = selectedFiles[i];
            const cleanFileName = `${Date.now()}_${i}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            
            const { error: imgError } = await db.storage
              .from('post-images')
              .upload(cleanFileName, file);

            if (imgError) {
              throw new Error(`Photo ${i+1} upload failed: ` + imgError.message);
            }
            uploadedImageNames.push(cleanFileName);
          }
        }

        statusMsg.innerText = "Saving fault data...";
        const imagesString = uploadedImageNames.join(',');

        const payload = {
          modal_number: model,
          board_number: board,
          solution_details: solution,
          circuit_image: imagesString,
          "Modal number": model,
          "Board number": board,
          "Circuit image": imagesString
        };

        const { error: dbError } = await db.from('Tv Posts').insert([payload]);

        if (dbError) {
          const { error: dbError2 } = await db.from('Tv Posts').insert([{
            modal_number: model,
            board_number: board,
            solution_details: solution,
            circuit_image: imagesString
          }]);
          if (dbError2) throw new Error("Save error: " + dbError2.message);
        }

        statusMsg.className = "text-center text-[11px] text-green-400 font-semibold block";
        statusMsg.innerText = `✓ Successfully saved with ${uploadedImageNames.length} image(s)!`;

        document.getElementById('admModel').value = '';
        document.getElementById('admBoard').value = '';
        document.getElementById('admSolution').value = '';
        fileInputs.forEach(inp => inp.value = '');

        setTimeout(() => {
          statusMsg.classList.add('hidden');
          document.getElementById('adminPanel').classList.add('hidden');
        }, 2000);

      } catch (err) {
        console.error(err);
        statusMsg.className = "text-center text-[11px] text-red-400 font-semibold block";
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = "Upload Directly to Database";
      }
    }

    async function searchInDatabase() {
      const modelInfo = document.getElementById('modelInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const verifiedPostsCard = document.getElementById('verifiedPostsCard');
      const verifiedPostsList = document.getElementById('verifiedPostsList');
      const outputCard = document.getElementById('outputCard');
      const resultContent = document.getElementById('resultContent');

      if (!modelInfo) {
        alert("Kripya Model Number ya Fault type karein.");
        return;
      }

      submitBtn.innerText = "Searching...";
      submitBtn.disabled = true;
      verifiedPostsList.innerHTML = "";
      verifiedPostsCard.classList.add('hidden');
      outputCard.classList.add('hidden');

      try {
        const { data, error } = await db.from('Tv Posts').select('*');

        let matched = false;

        if (data && data.length > 0) {
          const q = modelInfo.toLowerCase();
          
          const filterData = data.filter(p => {
            const m = (p.modal_number || p["Modal number"] || "").toLowerCase();
            const b = (p.board_number || p["Board number"] || "").toLowerCase();
            const s = (p.solution_details || p["solution_details"] || "").toLowerCase();
            return m.includes(q) || b.includes(q) || s.includes(q);
          });

          if (filterData.length > 0) {
            matched = true;
            verifiedPostsCard.classList.remove('hidden');

            filterData.forEach(post => {
              const card = document.createElement('div');
              card.className = "bg-slate-800 p-4 rounded-xl border border-green-500/50 space-y-3 shadow-md select-none";
              
              const rawImages = (post.circuit_image || post["Circuit image"] || "").trim();
              let imageTags = '';
              
              if (rawImages) {
                const imgList = rawImages.split(',').map(s => s.trim()).filter(Boolean);
                imageTags = `
                  <div class="space-y-2 mt-2">
                    <p class="text-[11px] text-green-300 font-bold">Circuit Diagrams (${imgList.length}) - Tap to Inspect:</p>
                    <div class="grid grid-cols-1 gap-2.5">
                      ${imgList.map(imgName => {
                        const fullUrl = `${SUPABASE_URL}/storage/v1/object/public/post-images/${imgName}`;
                        return `
                          <div class="relative bg-black/50 rounded-lg p-1 border border-slate-700">
                            <img src="${fullUrl}" onclick="openZoomModal('${fullUrl}')" draggable="false" oncontextmenu="return false;" class="w-full rounded cursor-pointer max-h-72 object-contain hover:opacity-90 active:scale-[0.99] transition" alt="Circuit Diagram">
                            <span class="absolute bottom-2 right-2 bg-blue-600/90 text-white text-[10px] font-bold px-2.5 py-1 rounded shadow pointer-events-none">🔍 Tap to Zoom & Drag</span>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }

              const solution = post.solution_details || post["solution_details"] || "Solution details available in diagram.";
              const modalName = post.modal_number || post["Modal number"] || modelInfo;
              const boardName = post.board_number || post["Board number"] || "N/A";

              card.innerHTML = `
                <div>
                  <span class="bg-green-600 text-white text-[10px] font-bold px-2.5 py-1 rounded">VERIFIED SOLUTION</span>
                  <h3 class="font-bold text-base text-white mt-1.5">${modalName}</h3>
                  <p class="text-xs text-slate-400">Board: ${boardName}</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                  <p class="text-xs text-slate-200 leading-relaxed"><strong class="text-green-400">Fix:</strong> ${solution}</p>
                </div>
                ${imageTags}
              `;
              verifiedPostsList.appendChild(card);
            });
          }
        }

        if (!matched) {
          await generateTvDiagnostics(modelInfo);
        }

      } catch (err) {
        console.error(err);
        await generateTvDiagnostics(modelInfo);
      } finally {
        submitBtn.innerText = "Analyze & Search Solutions";
        submitBtn.disabled = false;
      }
    }

    async function generateTvDiagnostics(query) {
      const outputCard = document.getElementById('outputCard');
      const resultContent = document.getElementById('resultContent');

      outputCard.classList.remove('hidden');
      resultContent.innerHTML = "<em>Analyzing circuit voltages & fault points with AI... Kripya thoda intezar karein...</em>";

      try {
        const promptText = `Aap ek professional Senior LED TV Repair Mechanic hain. Is query ke liye practical, direct aur step-by-step diagnostic guide Hinglish me dein: "${query}".
1. Primary Power Supply Voltages (12V, Standby 3.3V/5V)
2. Motherboard DC-DC Voltages (1.2V Core, 1.5V/1.8V RAM, 3.3V Flash)
3. Panel / T-Con Test Points (VCC 12V, VGH 26V-30V, VGL -6V, VCOM, AVDD)
4. Backlight Driver / Inverter Protection Points
5. Step-by-step troubleshooting recommendations.`;

        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              { role: "system", content: "You are an expert LED TV repair technician. Always answer clearly in Hinglish with precise voltage numbers." },
              { role: "user", content: promptText }
            ],
            model: "openai",
            seed: 42
          })
        });

        if (response.ok) {
          const text = await response.text();
          resultContent.innerText = text.trim();
        } else {
          resultContent.innerHTML = `
<strong>📌 Instant Diagnostic Reference for "${query}":</strong><br>
1. <strong>Power Supply:</strong> Check 12V / 5V Standby line.<br>
2. <strong>Motherboard Core:</strong> Check 1.2V Core & 3.3V Flash pin 8.<br>
3. <strong>Panel T-Con:</strong> Check VGH (+28V) and VGL (-6V).<br>
4. <strong>Backlight:</strong> Check BL_ON (3.3V) & boost diode.
          `;
        }
      } catch (err) {
        resultContent.innerHTML = `<span class="text-slate-400">Diagnosis ready for ${query}. Check standard power & panel lines.</span>`;
      }
    }
  </script>
</body>
</html>
